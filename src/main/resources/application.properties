spring.application.name=devops-demo

# No secret is hardcoded in this repository.
# Values are supplied as environment variables (see .env.example); the value
# after ':' is only a safe local default.
server.port=${SERVER_PORT:8080}
app.greeting=${APP_GREETING:Hello from the DevSecOps course project!}
app.api-key=${APP_API_KEY:}

# Error responses must never expose internals (stack traces, exception types,
# internal messages). These are the Spring Boot defaults; they are pinned here
# so a later change cannot silently relax them.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ---- Operations (Phase 4) ---------------------------------------------------
# Only these two endpoints are exposed: health for liveness and prometheus for
# scraping. env, beans, heapdump, threaddump, loggers etc. stay at 404 on
# purpose - they leak configuration and no dashboard needs them.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
